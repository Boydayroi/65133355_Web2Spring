<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết Sản Phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; }
        .product-card { border-radius: 20px; overflow: hidden; border: none; }
        .card-header-gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/sanpham">
                <i class="fa-solid fa-store text-warning me-2"></i> FIT-NTU Store
            </a>
        </div>
    </nav>

    <div class="container mt-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="col-md-7">
            
            <div th:if="${sanPham != null}" class="card product-card shadow-lg">
                <div class="card-header card-header-gradient text-white text-center py-4">
                    <i class="fa-solid fa-gem fa-3x mb-2 text-warning"></i>
                    <h3 class="mb-0 fw-bold">THÔNG TIN CHI TIẾT</h3>
                </div>
                <div class="card-body p-5 bg-white">
                    <div class="row mb-3 border-bottom pb-3">
                        <div class="col-sm-4 text-muted"><i class="fa-solid fa-barcode me-2"></i>Mã Sản Phẩm</div>
                        <div class="col-sm-8 fw-bold text-end" th:text="'#' + ${sanPham.id}"></div>
                    </div>
                    <div class="row mb-3 border-bottom pb-3">
                        <div class="col-sm-4 text-muted"><i class="fa-solid fa-cube me-2"></i>Tên Sản Phẩm</div>
                        <div class="col-sm-8 fw-bold fs-5 text-primary text-end" th:text="${sanPham.tenSanPham}"></div>
                    </div>
                    <div class="row mb-3 border-bottom pb-3">
                        <div class="col-sm-4 text-muted"><i class="fa-solid fa-layer-group me-2"></i>Thuộc Thể Loại</div>
                        <div class="col-sm-8 text-end">
                            <span class="badge bg-dark fs-6" th:text="${sanPham.theLoai.tenTheLoai}"></span>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 text-muted"><i class="fa-solid fa-tag me-2"></i>Giá Niêm Yết</div>
                        <div class="col-sm-8 fw-bold fs-4 text-danger text-end" th:text="${#numbers.formatDecimal(sanPham.gia, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></div>
                    </div>
                </div>
                <div class="card-footer text-center bg-light py-4 border-0">
                    <a th:href="@{/sanpham}" class="btn btn-secondary rounded-pill px-5 py-2 fw-bold shadow-sm">
                        <i class="fa-solid fa-arrow-left me-2"></i> QUAY LẠI CỬA HÀNG
                    </a>
                </div>
            </div>

            <div th:if="${sanPham == null}" class="alert alert-danger text-center shadow-lg p-5 rounded-4">
                <i class="fa-solid fa-triangle-exclamation fa-4x mb-3"></i>
                <h3 class="fw-bold">Ối! Lỗi rồi!</h3>
                <p class="fs-5">Không tìm thấy sản phẩm bạn yêu cầu trên hệ thống.</p>
                <a th:href="@{/sanpham}" class="btn btn-dark rounded-pill mt-3 px-4">
                    <i class="fa-solid fa-house me-2"></i> Về trang chủ
                </a>
            </div>

        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5 shadow-lg">
        <p class="mb-0">Đề thi Giữa kỳ 2 | Sinh viên thực hiện: <b>Hà Nguyễn Tiến Thịnh - 65133355</b></p>
    </footer>

</body>
</html>
