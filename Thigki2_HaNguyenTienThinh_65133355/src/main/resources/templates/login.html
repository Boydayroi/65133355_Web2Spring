<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập hệ thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; }
        .login-card { border-radius: 20px; border: none; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card login-card shadow-lg">
                    <div class="card-header bg-dark text-white text-center py-4">
                        <i class="fa-solid fa-user-shield fa-3x mb-2 text-warning"></i>
                        <h4 class="fw-bold">ĐĂNG NHẬP HỆ THỐNG</h4>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <div th:if="${error}" class="alert alert-danger text-center fw-bold" th:text="${error}"></div>
                        
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Tên đăng nhập</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                                    <input type="text" name="username" class="form-control" required placeholder="Nhập: admin">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-key text-muted"></i></span>
                                    <input type="password" name="password" class="form-control" required placeholder="Nhập: 123456">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 fs-5 rounded-pill shadow-sm">
                                <i class="fa-solid fa-right-to-bracket me-2"></i> ĐĂNG NHẬP
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
